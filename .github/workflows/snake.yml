name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Chandraprakash2005
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=FF9800&color_dots=#1d1f21,#00C6FF,#0072FF,#7F00FF,#FF00CC
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=FF9800&color_dots=#ebedf0,#00C6FF,#0072FF,#7F00FF,#FF00CC
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
